$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Nama sesuai', () => pm.expect(json.data.name).to.eql('Kuliah'));
    language: text/javascript
order: 3000
