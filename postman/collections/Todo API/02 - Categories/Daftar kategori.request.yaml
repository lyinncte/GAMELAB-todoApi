$kind: http-request
url: "{{baseUrl}}/api/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Berisi minimal 1 kategori', () => pm.expect(json.data.length).to.be.above(0));
    language: text/javascript
order: 2000
