$kind: http-request
url: "{{baseUrl}}/api/todos?category={{categoryId}}"
method: GET
queryParams:
  category: "{{categoryId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Ada hasil', () => pm.expect(json.data.length).to.be.above(0));
    language: text/javascript
order: 5000
