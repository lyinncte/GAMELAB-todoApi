$kind: http-request
url: "{{baseUrl}}/api/todos/{{todoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('ID sesuai', () => pm.expect(json.data._id).to.eql(pm.environment.get('todoId')));
    language: text/javascript
order: 8000
