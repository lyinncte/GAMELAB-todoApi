$kind: http-request
url: "{{baseUrl}}/api/todos?page=1&limit=1"
method: GET
queryParams:
  page: "1"
  limit: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Pagination benar', () => {
        pm.expect(json.data.length).to.eql(1);
        pm.expect(json.pagination.itemsPerPage).to.eql(1);
        pm.expect(json.pagination.totalItems).to.be.at.least(2);
        pm.expect(json.pagination.hasNextPage).to.eql(true);
      });
    language: text/javascript
order: 3000
