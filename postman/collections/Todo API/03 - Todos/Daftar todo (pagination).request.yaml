$kind: http-request
url: "{{baseUrl}}/api/todos?status=pending&page=1&limit=5"
method: GET
queryParams:
  status: pending
  page: "1"
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Pagination benar', () => {
        pm.expect(json.data.length).to.be.at.most(5);
        pm.expect(json.pagination.itemsPerPage).to.eql(5);
        pm.expect(json.pagination.totalItems).to.be.at.least(2);
      });
    language: text/javascript
order: 3000
