$kind: http-request
url: "{{baseUrl}}/api/todos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Kerjakan laporan",
      "priority": "low"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
