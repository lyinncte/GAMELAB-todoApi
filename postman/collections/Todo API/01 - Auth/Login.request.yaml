$kind: http-request
description: Login dengan akun hasil Register, lalu memperbarui token.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Ada token', () => pm.expect(json.data.token).to.be.a('string'));
      pm.environment.set('token', json.data.token);
    language: text/javascript
order: 2000
