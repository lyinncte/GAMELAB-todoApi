$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Email sesuai akun login', () => pm.expect(json.data.user.email).to.eql(pm.environment.get('email')));
    language: text/javascript
order: 3000
