$kind: http-request
url: "{{baseUrl}}/api/activity-logs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Ada log', () => pm.expect(json.data.length).to.be.above(0));
    language: text/javascript
order: 1000
