$kind: http-request
url: "{{baseUrl}}/api/activity-logs?action=create&limit=5"
method: GET
queryParams:
  action: create
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Semua berupa create', () => json.data.forEach((l) => pm.expect(l.action).to.eql('create')));
    language: text/javascript
order: 2000
