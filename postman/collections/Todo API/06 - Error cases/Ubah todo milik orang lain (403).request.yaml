$kind: http-request
url: "{{baseUrl}}/api/todos/{{todoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Dibajak orang lain"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenOther}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 11000
