$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      const json = pm.response.json();
      pm.test('Ada daftar errors', () => pm.expect(json.errors).to.be.an('array').that.is.not.empty);
    language: text/javascript
order: 1000
